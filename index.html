<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b3d24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sensei Games">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sensei Games</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Arka plan: futbol sahası -->
<div id="pitch"><svg viewBox="0 0 68 105" preserveAspectRatio="xMidYMid slice"><g fill="none" stroke="#fff" stroke-width=".4" opacity=".34">
<rect x="3" y="3" width="62" height="99"/><line x1="3" y1="52.5" x2="65" y2="52.5"/><circle cx="34" cy="52.5" r="9.15"/><circle cx="34" cy="52.5" r=".6" fill="#fff"/>
<rect x="13.85" y="3" width="40.3" height="16.5"/><rect x="24.85" y="3" width="18.3" height="5.5"/><path d="M26.7 19.5a9.15 9.15 0 0 0 14.6 0"/>
<rect x="13.85" y="85.5" width="40.3" height="16.5"/><rect x="24.85" y="96.5" width="18.3" height="5.5"/><path d="M26.7 85.5a9.15 9.15 0 0 1 14.6 0"/>
</g></svg></div>
<!-- 1) Açılış ekranı: yazı + dairesel yükleme çemberi (4 sn) -->
<section id="splash">
  <h1>Sensei Games</h1>
  <svg class="ring" viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle id="arc" cx="50" cy="50" r="44"/></svg>
</section>
<!-- 2) Ana menü -->
<section id="home" hidden>
  <button id="play">OYNA</button>
  <button id="multi" disabled>ÇOK OYUNCULU</button>
</section>
<!-- 3) Oyun -->
<section id="game" hidden>
  <div id="gbar"><i></i></div>
  <div id="topline">
    <div id="xpbox"><div id="star"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><b id="slvl">1</b></div>
      <div id="xpbar"><i id="xpfill"></i><span id="xptxt">0 - 15</span></div></div>
    <div id="rbox"><span class="coin"></span><div id="coinbar"><span id="coins">10</span></div>
      <div id="heart"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><b id="lives">5</b></div></div>
  </div>
  <div id="guess">
    <input id="inp" type="text" placeholder="Futbolcuyu tahmin et…" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="go">
    <button id="go">Tahmin</button>
  </div>
  <div id="msg"></div>
  <div id="career"></div>
  <div id="fabs">
    <button id="pass" class="fab"><span class="ic">⏭</span><em>Pas <b>3</b><s class="coin cs"></s></em></button>
    <button id="hint" class="fab"><span class="ic">💡</span><em>İpucu <b>1</b><s class="coin cs"></s></em></button>
  </div>
  <div id="result" hidden></div>
  <div id="up" hidden></div>
</section>
<script src="players.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
