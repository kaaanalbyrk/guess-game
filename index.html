<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b3d24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sensei Games">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sensei Games</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
// Hata şeridi: bir dosya yüklenmezse ya da kodda hata olursa ekranın üstünde kırmızı şerit çıkar
function sgHata(m){var b=document.getElementById('dbg');if(!b){b=document.createElement('div');b.id='dbg';b.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99;background:#b00020;color:#fff;font:12px/1.35 -apple-system,sans-serif;padding:calc(6px + env(safe-area-inset-top)) 10px 6px';document.body.appendChild(b)}b.textContent=m}
window.addEventListener('error',function(e){var t=e.target;if(t&&t.tagName==='SCRIPT'){sgHata('Dosya yüklenemedi: '+(t.getAttribute('src')||''));return}sgHata('Hata: '+e.message+' ('+String(e.filename||'').split('/').pop()+':'+e.lineno+')')},true);
</script>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gStar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f8fb"/><stop offset=".5" stop-color="#bcc3cf"/><stop offset="1" stop-color="#868e9d"/></linearGradient>
<radialGradient id="gCoin" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#fff7b8"/><stop offset=".45" stop-color="#ffd60a"/><stop offset="1" stop-color="#c78700"/></radialGradient>
<linearGradient id="gHeart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8f94"/><stop offset="1" stop-color="#df1b49"/></linearGradient>
<linearGradient id="gBulb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff59a"/><stop offset="1" stop-color="#ffc400"/></linearGradient>
<symbol id="sStar" viewBox="0 0 48 48"><polygon points="24,3 30.4,16.8 45.5,18.6 34.4,28.9 37.4,43.8 24,36.4 10.6,43.8 13.6,28.9 2.5,18.6 17.6,16.8" fill="url(#gStar)" stroke="#6b7384" stroke-width="2.2" stroke-linejoin="round"/><polygon points="24,9 28.6,18.8 39,20 31.2,27.2 33.3,37.5 24,32.4 14.7,37.5 16.8,27.2 9,20 19.4,18.8" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.2" stroke-linejoin="round"/></symbol>
<symbol id="sCoin" viewBox="0 0 48 48"><circle cx="24" cy="24" r="21.5" fill="url(#gCoin)" stroke="#a46f00" stroke-width="2.4"/><circle cx="24" cy="24" r="16.5" fill="none" stroke="#9a6600" stroke-opacity=".55" stroke-width="1.6"/><polygon points="24,12.5 27,20.2 35,20.8 28.8,26 30.8,33.8 24,29.5 17.2,33.8 19.2,26 13,20.8 21,20.2" fill="#c98a00" stroke="#fff3a0" stroke-opacity=".7" stroke-width=".8" stroke-linejoin="round"/><path d="M11 17a15 15 0 0 1 9-7" stroke="#fff" stroke-opacity=".7" stroke-width="2.2" fill="none" stroke-linecap="round"/></symbol>
<symbol id="sHeart" viewBox="0 0 48 48"><path transform="scale(2)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="url(#gHeart)" stroke="#9c1238" stroke-width=".9" stroke-linejoin="round"/><ellipse cx="14" cy="15" rx="6" ry="3.4" fill="#fff" opacity=".32" transform="rotate(-32 14 15)"/></symbol>
<symbol id="sBulb" viewBox="0 0 48 48"><path d="M24 4.5c-8.3 0-14.5 6.200-14.500 14 0 5.200 2.700 8.600 5.400 11.300 1.500 1.500 2.100 2.900 2.100 4.700V36h14v-1.500c0-1.800.6-3.200 2.100-4.700 2.700-2.700 5.400-6.100 5.400-11.300 0-7.800-6.200-14-14.500-14z" fill="url(#gBulb)" stroke="#b78900" stroke-width="1.8" stroke-linejoin="round"/><path d="M19.500 22.500l4.500 5.500 4.500-5.500" fill="none" stroke="#b78900" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="16" y="37.500" width="16" height="3.400" rx="1.700" fill="#a3aab7"/><rect x="18.500" y="41.800" width="11" height="3.200" rx="1.600" fill="#7c8493"/><path d="M17.500 14.500c1.700-3 4.500-4.600 7.500-4.600" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2.200" stroke-linecap="round"/></symbol>
<symbol id="sPass" viewBox="0 0 48 48"><circle cx="9.500" cy="35" r="5" fill="#fff"/><circle cx="38.500" cy="35" r="5" fill="#4ade80"/><path d="M11 28.500C14 10 31 8.500 37 25.500" fill="none" stroke="#4ade80" stroke-width="3.200" stroke-linecap="round" stroke-dasharray=".1 6.500"/><path d="M30.500 24.500l6.700 1.800 1.500-6.800" fill="none" stroke="#4ade80" stroke-width="3.400" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>
<!-- Arka plan: futbol sahası -->
<div id="pitch"><svg viewBox="0 0 68 105" preserveAspectRatio="xMidYMid slice"><g fill="none" stroke="#fff" stroke-width=".4" opacity=".34">
<rect x="3" y="3" width="62" height="99"/><line x1="3" y1="52.5" x2="65" y2="52.5"/><circle cx="34" cy="52.5" r="9.15"/><circle cx="34" cy="52.5" r=".6" fill="#fff"/>
<rect x="13.85" y="3" width="40.3" height="16.5"/><rect x="24.85" y="3" width="18.3" height="5.5"/><path d="M26.7 19.5a9.15 9.15 0 0 0 14.6 0"/>
<rect x="13.85" y="85.5" width="40.3" height="16.5"/><rect x="24.85" y="96.5" width="18.3" height="5.5"/><path d="M26.7 85.5a9.15 9.15 0 0 1 14.6 0"/>
</g></svg></div>
<!-- 1) Açılış ekranı -->
<section id="splash">
  <h1>Sensei Games</h1>
  <svg class="ring" viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle id="arc" cx="50" cy="50" r="44"/></svg>
</section>
<!-- 2) Ana menü -->
<section id="home" hidden>
  <button id="play">OYNA</button>
  <button id="multi" disabled>ÇOK OYUNCULU</button>
  <div id="ver"></div>
</section>
<!-- 3) Oyun -->
<section id="game" hidden>
  <div id="gbar"><i></i></div>
  <div id="topline">
    <div id="xpbox"><div id="star"><svg class="ico"><use href="#sStar"/></svg><b id="slvl">1</b></div>
      <div id="xpbar"><i id="xpfill"></i><span id="xptxt">0 - 15</span></div></div>
    <div id="rbox">
      <div id="coinbox"><div id="coinimg"><svg class="ico"><use href="#sCoin"/></svg></div><div id="coinbar"><span id="coins">10</span></div></div>
      <div id="heart"><svg class="ico"><use href="#sHeart"/></svg><b id="lives">5</b><small id="regen"></small></div>
    </div>
  </div>
  <div id="guess">
    <input id="inp" type="text" placeholder="Futbolcuyu tahmin et…" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="go">
    <button id="go">Tahmin</button>
  </div>
  <div id="msg"></div>
  <div id="career"></div>
  <div id="fabs">
    <button id="pass" class="fab"><span class="ic"><svg><use href="#sPass"/></svg></span><em>Pas <b>3</b><svg class="ci"><use href="#sCoin"/></svg></em></button>
    <button id="hint" class="fab"><span class="ic"><svg><use href="#sBulb"/></svg></span><em>İpucu <b>1</b><svg class="ci"><use href="#sCoin"/></svg></em></button>
  </div>
  <div id="result" hidden></div>
  <div id="up" hidden></div>
</section>
<script src="players.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
